# What each enforcement layer can express. Machine-verified on 2026-11-14 against the cited vendor
# documentation (see knowledge/sources/registry.yaml claims). Plan-dependent features are marked;
# the compiler reports them as "verify for your plan".
version: "2.0.0"
providers:
  cloudflare-waf:
    sourceIds: [SRC-CLOUDFLARE-WAF, SRC-CLOUDFLARE-FIELDS]
    country: true                    # ip.src.country (ISO 3166-1 alpha-2)
    subdivision: plan_dependent      # ip.src.subdivision_1_iso_code needs a Business or Enterprise plan
    challenge: true                  # managed_challenge, web browsers only
    log_only: plan_dependent         # the Log action is Enterprise-only
    nativeClientChallenge: false
    notes: Challenges need a browser; native iOS and API clients cannot solve them. The subdivision field is empty when the region is unknown.
  aws-cloudfront:
    sourceIds: [SRC-AWS-CLOUDFRONT-GEO]
    country: true
    subdivision: false
    challenge: false
    log_only: false
    nativeClientChallenge: false
    notes: Whole-distribution country allow list or block list only. If CloudFront cannot determine a user's location it SERVES the content (fails open), and blocked requests never reach AWS WAF.
  aws-waf:
    sourceIds: [SRC-AWS-WAF-GEO]
    country: true                    # GeoMatchStatement on ISO 3166-1 alpha-2 codes
    subdivision: true                # via a Count geo-match rule followed by label match on awswaf:clientip:geo:region:<CC>-<RR>
    challenge: true
    log_only: true                   # Count action
    nativeClientChallenge: false
    notes: Region matching needs two rules (geo match with Count to add labels, then a label match). Unknown country or region codes are labelled XX.
  app-store:
    sourceIds: [SRC-APPLE-REVIEW]
    country: true                    # territory availability in App Store Connect (coarse distribution control)
    subdivision: false
    challenge: false
    log_only: false
    nativeClientChallenge: false
    notes: Controls where the app is offered, not who can use it at runtime. It cannot express regions within a country.
