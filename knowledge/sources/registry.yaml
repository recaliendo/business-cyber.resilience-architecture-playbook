    verificationMethod: automated
    reviewCadenceDays: 90
    contentHash: "5e7719f77e8a606b257dc25958ee3222c4383300a5a34270a5b850a2ce8b8715"
    notes: "Amended by Regulation (EU) 2026/1744 (Digital Omnibus on AI). Consolidated texts are documentation; the Official Journal acts are authoritative."
    claims:
      - { id: art50-1-provider-interaction, claim: "Art. 50(1): providers must design AI systems that interact directly with people so that people are informed, unless obvious from context", status: confirmed }
      - { id: art50-2-provider-marking, claim: "Art. 50(2): providers of systems generating synthetic audio, image, video or text must mark outputs in a machine-readable, detectable way", status: confirmed }
      - { id: art50-3-deployer-emotion, claim: "Art. 50(3): deployers of emotion recognition or biometric categorisation systems must inform the people exposed", status: confirmed }
      - { id: art50-4-deployer-deepfake, claim: "Art. 50(4): deployers of systems generating deepfakes must disclose that the content is artificially generated or manipulated", status: confirmed }
      - { id: dates-original, claim: "General application 2 August 2026; Chapters I-II from 2 February 2025; GPAI and governance from 2 August 2025", status: confirmed }
