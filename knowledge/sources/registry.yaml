  # ============================ privacy ============================
  - id: SRC-GDPR
    publisher: European Union
    title: "Regulation (EU) 2016/679 (GDPR)"
    url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679"
    topic: privacy
    jurisdiction: EU
    official: true
    effectiveDate: "2018-05-25"
    retrievedAt: "2026-11-14T22:55:59Z"
    verifiedAt: "2026-11-14T22:55:59Z"
    verifiedBy: "Claude Code (automated read; not human sign-off)"
    verificationMethod: automated
    reviewCadenceDays: 365
    contentHash: "962539af03738bf552319ff4ce42d69e5f95a576307c4dfed7bf87e81b646b9d"
    notes: "Read from the official Cellar XHTML (CELEX 32016R0679). EUR-Lex metadata shows the act in force with no amending acts as of 2026-11-14. The ELI page renders only navigation to automated clients."
    claims:
      - { id: art3-2-targeting, claim: "Art. 3(2) applies to non-EU controllers/processors when processing relates to offering goods or services to, or monitoring the behaviour of, data subjects in the Union", status: confirmed }
      - { id: art8-1-child-age, claim: "Art. 8(1): parental authorisation below 16 for information society services offered directly to a child; member states may lower the age to no less than 13", status: confirmed }
      - { id: art27-2-exception, claim: "Art. 27(2): no representative needed for occasional processing without large-scale special-category or criminal data that is unlikely to result in a risk, or for public authorities", status: confirmed }
      - { id: art33-1-72h, claim: "Art. 33(1): notify the supervisory authority without undue delay and, where feasible, within 72 hours, unless the breach is unlikely to result in a risk", status: confirmed }
