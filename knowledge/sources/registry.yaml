  - id: SRC-EU-AI-ACT
    publisher: European Union
    title: "Regulation (EU) 2024/1689 (AI Act), consolidated version of 27 July 2026"
    url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727"
