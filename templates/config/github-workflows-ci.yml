# Copy to .github/workflows/ci.yml in a new project.
# Minimum CI: install, typecheck, build, secret scan. Add a gated dependency-audit job
# once you have a waiver mechanism for advisories with no available fix.
#
# Actions are pinned to full commit SHAs (tag in the trailing comment). Enable Dependabot for
# github-actions (templates/config/dependabot.yml) so the pins stay current.
# This workflow runs on `pull_request`, which gives fork PRs a read-only token and no secrets.
# Never switch it to `pull_request_target` while checking out PR code.
name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

# Least privilege for the GITHUB_TOKEN. Widen per job only when a step needs it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"   # or pin your major; keep it in sync with netlify.toml NODE_VERSION
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Build
        run: npm run build

  secret-scan:
    # gitleaks scans the full git history. The action always runs `gitleaks detect --redact`,
    # so findings show the file, line and rule but never the secret itself (verified in
    # gitleaks-action v3.0.0, src/gitleaks.js). An earlier version of this template used grep
    # and printed the matched secret into the CI log; do not do that.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # required for GitHub organisations, not personal accounts
