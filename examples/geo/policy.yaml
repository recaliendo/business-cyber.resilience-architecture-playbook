# SYNTHETIC EXAMPLE 5: geo-policy. NOT A PRODUCTION LIST AND NOT LEGAL ADVICE.
# - "XX" is a user-assigned ISO 3166 code used here as a stand-in for a comprehensively sanctioned
#   jurisdiction. Real entries must come from official sources with counsel review.
# - The Ukraine entries show how legally described REGIONAL restrictions are modelled: they must
#   never become a whole-country block. Wording and code mappings are illustrative only.
# Every rule is marked synthetic: true, so `bcr enforce plan` refuses it without --allow-synthetic.
policyId: example-geo-policy
version: 3
businessModel: b2c
quarterlyReviewDue: "2027-01-31"
rules:
