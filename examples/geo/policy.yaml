    track: sanctions
    selector: { type: country, code: XX }
    action: BLOCK
    reason: Synthetic stand-in for a comprehensive country program.
    legalBasis: "SYNTHETIC: cite the specific program and regulation here."
    sourceRefs: [SRC-OFAC-PROGRAMS]
    confidence: high
    dateAdded: "2026-08-01"
    effectiveDate: "2026-08-01"
    reviewDate: "2027-01-31"
    counselReviewed: true
    synthetic: true
  - id: SAN-US-OFAC-UA-CRIMEA
    track: sanctions
    selector:
      type: territory
      country: UA
      legalDescription: "SYNTHETIC wording: the Crimea region of Ukraine as described in the relevant program."
      approximateSubdivisions: [UA-43, UA-40]
      mappingNote: "Counsel-agreed approximation (synthetic): Autonomous Republic of Crimea (UA-43) and Sevastopol (UA-40)."
    action: BLOCK
    reason: Regional restriction modelled as a territory, not a country.
    legalBasis: "SYNTHETIC: cite the program and section here."
    sourceRefs: [SRC-OFAC-PROGRAMS]
    confidence: medium
    dateAdded: "2026-08-01"
    effectiveDate: "2026-08-01"
    reviewDate: "2027-01-31"
    counselReviewed: true
    synthetic: true
  - id: SAN-US-OFAC-UA-DNR-LNR
    track: sanctions
    selector:
      type: territory
      country: UA
