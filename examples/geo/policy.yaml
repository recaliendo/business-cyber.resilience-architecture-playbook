    reason: Shows a rule that cannot be compiled to edge rules without a counsel-agreed mapping.
    legalBasis: "SYNTHETIC: cite the program and section here."
    sourceRefs: [SRC-OFAC-PROGRAMS]
    confidence: medium
    dateAdded: "2026-08-01"
    effectiveDate: "2026-08-01"
    reviewDate: "2027-01-31"
    counselReviewed: false
    synthetic: true
